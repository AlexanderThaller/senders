[package]
name = "senders-web"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Browser frontend for senders: encrypts and decrypts in the client"

[workspace]

[dependencies]
senders-proto = { path = "../proto" }

leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-streams = "0.5"
futures-util = "0.3"
futures-channel = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlInputElement",
  "Location", "Navigator", "Url", "UrlSearchParams",
  "Crypto", "SubtleCrypto", "CryptoKey",
  "Blob", "BlobPropertyBag", "File", "FilePropertyBag", "FileList", "DataTransfer",
  "DragEvent", "Event", "EventTarget", "ProgressEvent",
  "XmlHttpRequest", "XmlHttpRequestUpload", "XmlHttpRequestResponseType",
  "Request", "RequestInit", "RequestMode", "Response", "Headers",
  "ReadableStream", "AbortController", "AbortSignal",
  "Clipboard",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
