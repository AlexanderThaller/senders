<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>senders — end-to-end encrypted file transfer</title>
    <meta name="description" content="Encrypt a file in your browser and share a link. The server never sees the key." />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191817" />
    <!-- Open Graph tags, for link-preview cards (Teams, Slack, ...). The
         server rewrites __PUBLIC_URL__ to config.public_url at startup, from
         the raw file on disk -- see server::render_index_html. Title and
         description are the same for every route: the server never learns
         what a share link points to, and the preview must not either. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="senders" />
    <meta property="og:title" content="senders — end-to-end encrypted file transfer" />
    <meta property="og:description" content="Encrypt a file in your browser and share a link. The server never sees the key." />
    <meta property="og:url" content="__PUBLIC_URL__/" />
    <meta property="og:image" content="__PUBLIC_URL__/icons/icon-512.png" />
    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="copy-dir" href="fonts" />
    <!-- The icon set is generated by scripts/gen-icons.sh; favicon.ico is
         copied to the root as well because that is where a client that never
         reads this document looks for it. -->
    <link data-trunk rel="copy-dir" href="icons" />
    <link data-trunk rel="copy-file" href="icons/favicon.ico" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icons/mask-icon.svg" color="#1f6b5f" />
    <link rel="manifest" href="/icons/site.webmanifest" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
  </head>
  <body>
    <div class="boot" id="boot">
      <span class="boot__mark"></span>
      <span class="boot__text">Loading…</span>
    </div>
  </body>
</html>
