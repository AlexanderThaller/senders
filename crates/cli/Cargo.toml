[package]
name = "senders-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line client for a senders server"

[[bin]]
name = "senders-cli"
path = "src/main.rs"

[dependencies]
senders-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
bytes = "1"
url = { version = "2", features = ["serde"] }
anyhow = "1"
indicatif = "0.18"
# Only to turn the server's absolute expiry into a readable timestamp. Already
# resolved for the workspace by the server's OIDC dependencies.
chrono = { version = "0.4", default-features = false, features = ["std"] }

aes-gcm = "0.10"
hkdf = "0.12"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.9"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
