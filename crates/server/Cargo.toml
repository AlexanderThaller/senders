[package]
name = "senders-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "End-to-end encrypted file sharing server"

[[bin]]
name = "senders"
path = "src/main.rs"

[features]
default = ["s3", "oidc"]
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]
oidc = ["dep:openidconnect", "dep:reqwest"]

[dependencies]
senders-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

axum = { version = "0.8", features = ["macros", "http2"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "set-header"] }
futures-util = "0.3"
bytes = "1"
async-trait = "0.1"

fred = { version = "10", default-features = false, features = ["i-hashes", "i-keys", "i-sorted-sets", "i-scripts", "i-server"] }

sha2 = "0.10"
hmac = "0.12"
subtle = "2"
rand = "0.9"

clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

aws-config = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio", "sso"] }
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }

openidconnect = { version = "4", optional = true, default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
sha2 = "0.10"

[lints]
workspace = true
