name: Bazel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  bazel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Restores four caches through actions/cache: the Bazel binary itself
      # (keyed on .bazelversion), the repository cache of downloaded external
      # archives, the disk cache of action outputs, and the materialised
      # external repositories.
      #
      # external-cache is the one that is easy to skip and shouldn't be.
      # repository-cache only avoids re-downloading the archives; Bazel still
      # re-runs the repository rules and re-extracts every external repo on a
      # fresh output base, and that includes the Rust toolchain and the
      # aws-lc-sys C sources.
      #
      # cache-save is limited to pushes so pull requests read the main-branch
      # cache without each PR writing its own copy. GitHub evicts least-recently
      # used entries once a repository exceeds 10 GB in total.
      # https://github.com/bazel-contrib/setup-bazel
      - name: Set up Bazel with caching
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          external-cache: true
          disk-cache: ${{ github.workflow }}
          cache-save: ${{ github.event_name != 'pull_request' }}

      # One invocation covers build, test, clippy and rustfmt: the latter two
      # are ordinary targets in the BUILD files rather than aspects behind a
      # --config, so nothing here discards another step's analysis cache.
      #
      # --lockfile_mode=error fails the build if MODULE.bazel.lock does not
      # match MODULE.bazel, rather than silently regenerating it, so a stale
      # committed lockfile is caught here instead of drifting.
      - name: Build, test, clippy and rustfmt
        run: bazel test --lockfile_mode=error //...

  # The frontend is not part of the Bazel build -- it targets wasm32 and needs
  # wasm-bindgen and wasm-opt on top of rustc, which trunk already does -- so
  # `bazel test //...` above covers none of it. Without this job the browser
  # cryptography, which is the part that actually matters, would go untested
  # and unlinted in CI.
  wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo registry and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/web/target
          key: wasm-${{ runner.os }}-${{ hashFiles('crates/web/Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-

      # The runner has to match the wasm-bindgen crate exactly or it fails with
      # "failed to find the __wbindgen_externref_table_alloc function", so the
      # version is read out of the lockfile rather than pinned separately here.
      - name: Install wasm-bindgen-test-runner
        working-directory: crates/web
        run: |
          set -euo pipefail
          version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          echo "wasm-bindgen ${version}"
          tmp=$(mktemp -d)
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xzf - -C "$tmp" --strip-components=1
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$tmp/wasm-bindgen-test-runner" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The same lint set the Bazel targets enforce, from the same manifest.
      - name: Clippy
        working-directory: crates/web
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Format check
        working-directory: crates/web
        run: cargo fmt --all -- --check

      # Runs under Node against the compiled wasm: key separation, tamper and
      # truncation detection, and byte-exact round trips.
      - name: Browser-crypto tests
        working-directory: crates/web
        run: cargo test --target wasm32-unknown-unknown
